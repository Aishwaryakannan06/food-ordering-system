spring.application.name=food-ordering-system
server.port=8080

# Create a MySQL database named food_ordering first.
spring.datasource.url=jdbc:mysql://localhost:3306/food_ordering?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
